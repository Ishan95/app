name: app
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+2

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  fluttertoast: ^8.2.12
  dio: ^5.9.0
  flutter_spinkit: ^5.2.2
  flutter_svg: ^2.2.0
  shared_preferences: ^2.5.3
  lottie: ^3.3.1
  image_picker: ^1.2.0
  image_cropper: ^9.1.0
  camera: ^0.11.2
  intl: ^0.20.2
  http_parser: ^4.1.2
  firebase_auth: ^6.1.0
  firebase_core: ^4.1.1
  firebase_messaging: ^16.0.4
  flutter_local_notifications: ^19.4.2
  cloud_firestore: ^6.0.2
  flutter_slidable: ^4.0.3
  cached_network_image: ^3.4.1
  package_info_plus: ^9.0.0
  firebase_storage: ^13.0.3
  firebase_remote_config: ^6.1.1
  url_launcher: ^6.3.2
  firebase_crashlytics: ^5.0.4
  device_info_plus: ^12.3.0
  flutter_launcher_icons: ^0.14.4
  video_player: ^2.11.1
  # firebase_messaging_platform_interface: ^4.7.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21

flutter:

  uses-material-design: true
  assets:
    - assets/images/
    - assets/svg/
    - assets/videos/
    - assets/lottie/
    - assets/videos/splash_animation.mp4
    

  fonts:
    - family: Mulish
      fonts:
        - asset: assets/fonts/mulish/Mulish-Black.ttf
        - asset: assets/fonts/mulish/Mulish-BlackItalic.ttf
          style: italic
        - asset: assets/fonts/mulish/Mulish-Bold.ttf
        - asset: assets/fonts/mulish/Mulish-BoldItalic.ttf
          style: italic
        - asset: assets/fonts/mulish/Mulish-ExtraBold.ttf
        - asset: assets/fonts/mulish/Mulish-ExtraBoldItalic.ttf
          style: italic
        - asset: assets/fonts/mulish/Mulish-ExtraLight.ttf
        - asset: assets/fonts/mulish/Mulish-LightItalic.ttf
          style: italic
        - asset: assets/fonts/mulish/Mulish-Italic.ttf
          style: italic
        - asset: assets/fonts/mulish/Mulish-Light.ttf
        - asset: assets/fonts/mulish/Mulish-ExtraLightItalic.ttf
          style: italic
        - asset: assets/fonts/mulish/Mulish-Medium.ttf
        - asset: assets/fonts/mulish/Mulish-MediumItalic.ttf
          style: italic
        - asset: assets/fonts/mulish/Mulish-Regular.ttf
        - asset: assets/fonts/mulish/Mulish-SemiBold.ttf
        - asset: assets/fonts/mulish/Mulish-SemiBoldItalic.ttf
          style: italic
    - family: SplitEvIcons
      fonts:
        - asset: assets/fonts/SplitEvIcons.otf
    - family: SfPro
      fonts:
        - asset: assets/fonts/sfpro/FontsFree-Net-SFProDisplay-Medium.ttf
    - family: Nunito
      fonts:
        - asset: assets/fonts/nunito/Nunito-Regular.ttf